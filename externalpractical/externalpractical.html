<!DOCTYPE html>
<html>
<head>
    <title>External Practical</title>
</head>

<body style="
    font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    background-color: #d2c7c7;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 500px;">
<div style="
        background: white;
        padding: 30px;
        border-radius: 30px;
        box-shadow:  10px 10px 10px rgba(0,0,0,0.2);
        text-align: center;
        width: 350px;">

        <h2>Age Calculator</h2>

        <label>Enter your date of birth</label>
        <br><br>

        <input type="date" id="dob" style="
            padding: 10px;
            width: 200px;
        ">

        <br><br>

        <button onclick="age()" style="
            padding: 10px 20px;
            background-color: rgb(227, 14, 14);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        ">
            Calculate Age
        </button>

        <br><br>

        <p id="output" style="
            font-size: 18px;
            font-weight: bold;
        "></p>

    </div>

    <script>
        function age() {

            let dob = document.getElementById("dob").value;

            if(dob === "") {
                document.getElementById("output").innerHTML =
                "Please select your Date of Birth";
                return;
            }

            let birthdate = new Date(dob);
            let today = new Date();

            let age = today.getFullYear() - birthdate.getFullYear();

            let monthdifference =
                today.getMonth() - birthdate.getMonth();

            if (
                monthdifference < 0 ||
                (monthdifference === 0 &&
                 today.getDate() < birthdate.getDate())
            ) {
                age--;
            }

            document.getElementById("output").innerHTML =
                "Your Age is " + age + " years";
        }
    </script>

</body>
</html>
